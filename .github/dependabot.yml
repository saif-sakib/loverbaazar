version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/store
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
  - package-ecosystem: gomod
    directory: /apps/api
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
