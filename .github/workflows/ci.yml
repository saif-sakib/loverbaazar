name: CI
on:
  pull_request:
  workflow_call:
permissions: { contents: read }
jobs:
  validate:
    name: Store CI
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: { go-version-file: apps/api/go.mod, cache-dependency-path: apps/api/go.sum }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: apps/store/package-lock.json }
      - name: Go race, API and JavaScript checks
        run: ./scripts/check.sh
      - name: Migration unit checks
        run: python3 -m unittest migration.test_migration
        working-directory: scripts
      - name: Encrypted backup and restore rehearsal
        run: BACKUP_PG_DOCKER=1 ./scripts/test-backup.sh
      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
        working-directory: apps/store
      - name: Store build, browser, accessibility and disposable checkout
        run: ./scripts/test-mobile.sh --ci
