name: Publish store
on:
  push: { branches: [main] }
  repository_dispatch: { types: [publish] }
  workflow_dispatch:
  schedule:
    - cron: "23 0 * * *" # 06:23 Bangladesh time
concurrency:
  group: publish
  queue: max
permissions: { contents: read }
jobs:
  test:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: test
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      vars.COORDINATED_RELEASES == 'true' &&
      ((needs.test.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) ||
       (needs.test.result == 'skipped' && (github.event_name == 'repository_dispatch' ||
        (github.event_name == 'schedule' && vars.SEO_REFRESH_ENABLED == 'true' && vars.STORE_ENV == 'production'))))
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      STORE_URL: ${{ vars.STORE_URL }}
      CATALOG_URL: ${{ vars.CATALOG_URL }}
      WRANGLER_SEND_METRICS: "false"
    defaults: { run: { working-directory: apps/store } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: apps/store/package-lock.json }
      - name: Require current main revision
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
      - run: npm ci --no-audit --no-fund
      - name: Coordinate Render and verify API readiness
        run: node ../../scripts/release-provider.mjs api
        env:
          DEPLOY_RENDER: ${{ needs.test.result == 'success' }}
          RENDER_API_KEY: ${{ needs.test.result == 'success' && secrets.RENDER_API_KEY || '' }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      - name: Prepare frozen release
        run: node ../../scripts/release.mjs init
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      - name: Build frozen catalog
        run: npm run build
        env:
          PUBLIC_TURNSTILE_SITE: ${{ vars.TURNSTILE_SITE }}
          BUILD_ENV: ${{ vars.STORE_ENV || 'preview' }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      - name: Promote version and verify visible artifact
        run: node ../../scripts/release-provider.mjs store
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Confirm publication
        id: confirm
        run: node ../../scripts/release.mjs published
      - name: Recover incomplete promotion
        if: (failure() || cancelled()) && steps.confirm.outcome == 'skipped'
        run: node ../../scripts/release-provider.mjs recover
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Record failed publication
        if: (failure() || cancelled()) && steps.confirm.outcome == 'skipped'
        run: node ../../scripts/release.mjs failed
      - name: Notify IndexNow
        if: success() && vars.STORE_ENV == 'production' && vars.INDEXNOW_KEY != ''
        continue-on-error: true
        run: node ../../scripts/indexnow.mjs
        env:
          BUILD_ENV: ${{ vars.STORE_ENV || 'preview' }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
