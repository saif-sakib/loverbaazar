name: Publish store
on:
  push: { branches: [main] }
  repository_dispatch: { types: [publish] }
  workflow_dispatch:
concurrency: { group: publish, cancel-in-progress: true }
jobs:
  test: # code pushes only: the admin's Publish button changes content, not code
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: dev, POSTGRES_DB: lb }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 15
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: apps/api/go.mod, cache-dependency-path: apps/api/go.sum }
      - run: test -z "$(gofmt -l .)"
      - run: go vet .
      - run: go test -count=1 .
        env: { TEST_DATABASE_URL: "postgres://postgres:dev@127.0.0.1:5432/lb?sslmode=disable" }
  deploy:
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    defaults: { run: { working-directory: apps/store } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - if: env.CF_READY == 'true' && vars.CATALOG_URL == ''
        run: |
          echo "::error::Set the CATALOG_URL variable. Without it this deploy would replace the shop with the old imported data."
          exit 1
      - run: npx astro build
        env:
          CATALOG_URL: ${{ vars.CATALOG_URL }}
          PUBLIC_TURNSTILE_SITE: ${{ vars.TURNSTILE_SITE }}
      - if: env.CF_READY != 'true'
        run: echo "::warning::Deploy skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (docs/go-live.md, Step 7)."
      - if: env.CF_READY == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
