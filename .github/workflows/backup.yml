name: Nightly backup
on:
  schedule: [{ cron: "17 20 * * *" }] # 02:17 Bangladesh time
  workflow_dispatch:
concurrency: { group: backup, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - name: Capture and verify encrypted database backup
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_PG_DOCKER: "1"
        run: python3 scripts/backup-store.py create "$RUNNER_TEMP/loverbaazar.tar.gpg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: loverbaazar-verified-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/loverbaazar.tar.gpg
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
